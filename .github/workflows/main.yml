name: Program 3 - ALTER Student Table Auto Grading

on:
  push:
  workflow_dispatch:

jobs:
  grade:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: CollegeDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}
          do
            if mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -proot \
              --protocol=tcp \
              --silent
            then
              echo "MySQL is ready."
              break
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create Student Table
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            --protocol=tcp \
            CollegeDB <<'SQL'

          CREATE TABLE Student (
              StudentID INT PRIMARY KEY,
              StudentName VARCHAR(20),
              DOB DATE,
              Gender VARCHAR(10),
              DepartmentID INT
          );

          SQL

          echo "Student table created successfully."

      - name: Show Original Student Table
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            --protocol=tcp \
            -e "USE CollegeDB; DESCRIBE Student;"

      - name: Execute Student Program
        run: |
          echo "======================================"
          echo "Executing student solution.sql"
          echo "======================================"

          cat solution.sql

          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            --protocol=tcp \
            CollegeDB < solution.sql

          echo "Student SQL executed successfully."

      - name: Show Modified Student Table
        run: |
          echo "======================================"
          echo "MODIFIED STUDENT TABLE"
          echo "======================================"

          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            --protocol=tcp \
            -e "USE CollegeDB; DESCRIBE Student;"

      - name: Run Auto Grading
        run: |
          chmod +x tests/test.sh
          ./tests/test.sh

      - name: Success
        if: success()
        run: |
          echo "=========================================="
          echo "PROGRAM 3 COMPLETED SUCCESSFULLY"
          echo "ALL TEST CASES PASSED"
          echo "=========================================="
